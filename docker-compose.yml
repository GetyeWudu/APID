# APID Backend & Infrastructure Compose Setup
# Note: Frontend (React + Vite) runs locally via `npm run dev` on port 5173 (not in Docker).
# Tip for daily backend coding: run `docker compose up -d postgres redis` and launch Spring Boot from your IDE.

services:
  postgres:
    image: postgres:16-alpine
    container_name: apid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apid_db}
      POSTGRES_USER: ${POSTGRES_USER:-apid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apid_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apid_user} -d ${POSTGRES_DB:-apid_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apid-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apid-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "apid.test:10.9.82.23"
      - "apid-dc01.apid.test:10.9.82.23"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UnlockDiagnosticVMOptions -XX:-UseSHA256Intrinsics -XX:-UseSHA512Intrinsics"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-apid_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-apid_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-apid_local_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      APID_COOKIE_SECURE: ${APID_COOKIE_SECURE:-false}
      APID_BOOTSTRAP_ADMIN_USERNAME: ${APID_BOOTSTRAP_ADMIN_USERNAME:-admin}
      APID_BOOTSTRAP_ADMIN_PASSWORD: ${APID_BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APID_STORAGE_PATH: ${APID_STORAGE_PATH:-/app/uploads}
      MEETING_PROVIDER: ${MEETING_PROVIDER:-livekit}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-http://10.9.36.155:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://10.9.36.155:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-APIDLocalKey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-HErVoKzJMGiiWkzXrZMPaKMGc1IWXISSjuxGI1AJNic=}
      LIVEKIT_TOKEN_TTL: ${LIVEKIT_TOKEN_TTL:-7200}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://10.9.36.155:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      APID_LDAP_ENABLED: ${APID_LDAP_ENABLED:-true}
      APID_LDAP_URL: ${APID_LDAP_URL:-ldaps://10.9.82.23:636}
      APID_LDAP_BASE_DN: ${APID_LDAP_BASE_DN:-DC=apid,DC=test}
      APID_LDAP_DOMAIN: ${APID_LDAP_DOMAIN:-apid.test}
      APID_LDAP_USER_SEARCH_BASE: ${APID_LDAP_USER_SEARCH_BASE:-OU=APID,DC=apid,DC=test}
      APID_LDAP_BIND_DN: ${APID_LDAP_BIND_DN:-CN=APID LDAP Service Account,OU=Service Accounts,OU=APID,DC=apid,DC=test}
      APID_LDAP_BIND_PASSWORD: ${APID_LDAP_BIND_PASSWORD:-}
      APID_LDAP_TIMEOUT_MS: ${APID_LDAP_TIMEOUT_MS:-5000}
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
  redis_data:

