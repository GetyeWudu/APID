# APID Backend & Infrastructure Compose Setup
# Note: Frontend (React + Vite) runs locally via `npm run dev` on port 5173 (not in Docker).
# Tip for daily backend coding: run `docker compose up -d postgres redis` and launch Spring Boot from your IDE.

services:
  postgres:
    image: postgres:16-alpine
    container_name: apid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apid_db}
      POSTGRES_USER: ${POSTGRES_USER:-apid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apid_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apid_user} -d ${POSTGRES_DB:-apid_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apid-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apid-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-apid_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-apid_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-apid_local_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      APID_COOKIE_SECURE: ${APID_COOKIE_SECURE:-false}
      APID_BOOTSTRAP_ADMIN_USERNAME: ${APID_BOOTSTRAP_ADMIN_USERNAME:-admin}
      APID_BOOTSTRAP_ADMIN_PASSWORD: ${APID_BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APID_STORAGE_PATH: ${APID_STORAGE_PATH:-/app/uploads}
      DAILY_API_BASE_URL: ${DAILY_API_BASE_URL:-https://api.daily.co/v1}
      DAILY_API_KEY: ${DAILY_API_KEY:-}
      DAILY_WEBHOOK_SECRET: ${DAILY_WEBHOOK_SECRET:-}
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
  redis_data:

