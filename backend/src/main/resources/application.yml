server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: apid-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/apid_db}
    username: ${SPRING_DATASOURCE_USERNAME:apid_user}
    password: ${SPRING_DATASOURCE_PASSWORD:apid_local_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    schemas: core,coaching,mentoring
    default-schema: core
    locations: classpath:db/migration
    out-of-order: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 3600000

  jackson:
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

apid:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    path: ${APID_STORAGE_PATH:../uploads}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:apid}
    audience: ${JWT_AUDIENCE:apid-api}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  security:
    cookie-secure: ${APID_COOKIE_SECURE:false}
    bcrypt-strength: ${APID_BCRYPT_STRENGTH:12}
  bootstrap:
    admin-username: ${APID_BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${APID_BOOTSTRAP_ADMIN_PASSWORD:}
  meeting:
    provider: ${MEETING_PROVIDER:livekit}
  livekit:
    api-url: ${LIVEKIT_API_URL:http://10.9.36.155:7880}
    public-url: ${LIVEKIT_PUBLIC_URL:ws://10.9.36.155:7880}
    api-key: ${LIVEKIT_API_KEY:APIDLocalKey}
    api-secret: ${LIVEKIT_API_SECRET:HErVoKzJMGiiWkzXrZMPaKMGc1IWXISSjuxGI1AJNic=}
    token-ttl-seconds: ${LIVEKIT_TOKEN_TTL:7200}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://10.9.36.155:11434}
      model: ${OLLAMA_MODEL:qwen3:8b}
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
  ldap:
    enabled: ${APID_LDAP_ENABLED:false}
    url: ${APID_LDAP_URL:ldaps://10.9.82.23:636}
    base-dn: ${APID_LDAP_BASE_DN:DC=apid,DC=test}
    domain: ${APID_LDAP_DOMAIN:apid.test}
    user-search-base: ${APID_LDAP_USER_SEARCH_BASE:OU=APID,DC=apid,DC=test}
    user-search-filter: ${APID_LDAP_USER_SEARCH_FILTER:(&(objectCategory=person)(objectClass=user)(|(sAMAccountName={0})(userPrincipalName={1})(employeeID={2})))}
    bind-dn: ${APID_LDAP_BIND_DN:CN=APID LDAP Service Account,OU=Service Accounts,OU=APID,DC=apid,DC=test}
    bind-password: ${APID_LDAP_BIND_PASSWORD:}
    timeout-ms: ${APID_LDAP_TIMEOUT_MS:5000}
    trust-cert-path: ${APID_LDAP_TRUST_CERT_PATH:classpath:certs/apid-ca.crt}

  daily:
    api-base-url: ${DAILY_API_BASE_URL:https://api.daily.co/v1}
    api-key: ${DAILY_API_KEY:}
    webhook-secret: ${DAILY_WEBHOOK_SECRET:}
    domain-name: ${DAILY_DOMAIN_NAME:amakari}

mentoring:
  ocr:
    url: ${PADDLE_OCR_URL:http://localhost:8001/ocr}
  ai:
    ollama:
      chat-url: ${MENTORING_AI_OLLAMA_CHAT_URL}
      model: ${MENTORING_AI_OLLAMA_MODEL:olmo2:13b}
daily:
  api-base-url: ${DAILY_API_BASE_URL:https://api.daily.co/v1}
  api-key: ${DAILY_API_KEY:}
  webhook-secret: ${DAILY_WEBHOOK_SECRET:}
  domain-name: ${DAILY_DOMAIN_NAME:amakari}


